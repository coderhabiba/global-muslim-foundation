<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Netlify Forms Skeleton</title>
</head>
<body>
  <!-- 1. Newsletter Subscription Form -->
  <form name="newsletter-subscription" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="newsletter-subscription" />
    <input type="email" name="email" />
  </form>

  <!-- 2. Volunteer Application Form -->
  <form name="volunteer-application" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="volunteer-application" />
    <input type="text" name="fullName" />
    <input type="tel" name="phone" />
    <input type="email" name="email" />
    <input type="text" name="district" />
    <input type="text" name="wing" />
    <input type="text" name="commitment" />
    <input type="text" name="skills" />
    <textarea name="experience"></textarea>
  </form>
</body>
</html>
