[build]
  # Next.js App Router build (see next.config.ts for legacy URL redirects)
  command = "npm run build"
  publish = ".next"

# Official Netlify adapter: runs the Next.js server output on Netlify Functions
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Security headers carried over from the legacy static deployment
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache static media assets served from /public
[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Legacy static configuration (html pages, _redirects) is archived in /legacy.
# Clean URLs, custom 404 and the *.html -> route redirects are now handled by
# the App Router (`app/not-found.tsx`) and `next.config.ts`.
