[build]
  # Directory containing the static site files
  publish = "."

# Security and caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache static screenshots and media assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# NOTE: no `/* -> /404.html` catch-all rule here on purpose.
# Netlify automatically serves 404.html from the publish root for unknown
# paths. A catch-all 404 rule would intercept Netlify's own pretty-URL
# resolution (/about -> about.html) and turn every page into "Page not found".
